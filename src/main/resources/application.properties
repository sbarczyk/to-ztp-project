spring.application.name=to-ztp
ztp.gtfs.url=https://gtfs.ztp.krakow.pl
ztp.gtfs.static.file=GTFS_KRK.zip
ztp.gtfs.data-dir=data

# Po??czenie do bazy danych (zgodne z docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/gtfs_db
spring.datasource.username=ztp_user
spring.datasource.password=ztp_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - automatyczne tworzenie tabel
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === OPTYMALIZACJA WYDAJNO?CI (WA?NE DLA GTFS) ===
# Dzi?ki temu Spring nie b?dzie robi? 1000 zapyta? INSERT, tylko wy?le jedn? paczk?
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true